version: 2

models:
  - name: silver_orders
    description: "Tabla de ordenes estandarizada con timestamps validados"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null

  - name: silver_order_payments
    description: "Detalle de transacciones de pago con validacion de monto positivo"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: gold_daily_sales
    description: "Data Mart diario con metricas agregadas de ventas y SLA logistico"
    columns:
      - name: order_date
        tests:
          - not_null
          - unique
      - name: total_orders
        tests:
          - not_null

  - name: gold_payment_insights
    description: "Data Mart con metricas agregadas por tipo de medio de pago"
    columns:
      - name: payment_type
        tests:
          - not_null
          - unique
